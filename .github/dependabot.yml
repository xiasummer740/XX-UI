version: 2
updates:
  # Keep the pinned GitHub Actions current (this is also the only automated
  # signal that an action we trust has been retagged).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Go module updates: the SQLite driver in particular ships memory-safety and
  # correctness fixes that matter for a panel holding every credential.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Base image updates (Go toolchain version must match go.mod).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
